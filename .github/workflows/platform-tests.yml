name: TRACE Platform backend tests

on:
  push:
    paths:
      - 'platform-prototype/backend/**'
      - '.github/workflows/platform-tests.yml'
  pull_request:
    paths:
      - 'platform-prototype/backend/**'
      - '.github/workflows/platform-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-prototype/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform-prototype/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
