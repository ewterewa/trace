name: Deploy TRACE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build presentation website
        run: |
          npm install
          npm run build
      - name: Add standalone TRACE platform demo
        run: |
          mkdir -p dist/platform
          cp -R platform-prototype/demo-site/. dist/platform/
      - name: Validate TRACE demo JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("platform-prototype/demo-site/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", source, re.S)
          assert scripts, "No inline application script found"
          Path("/tmp/trace-demo.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/trace-demo.js
      - name: Validate synthetic GPX fixture
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          source = Path("platform-prototype/demo-site/samples/SYNTHETIC_DEMO_ROUTE.gpx")
          root = ET.parse(source).getroot()
          points = root.findall(".//{*}trkpt") + root.findall(".//{*}rtept") + root.findall(".//{*}wpt")
          assert len(points) >= 2, "Synthetic GPX fixture must contain at least two points"
          for point in points:
              lat, lon = float(point.attrib["lat"]), float(point.attrib["lon"])
              assert -90 <= lat <= 90 and -180 <= lon <= 180, "Invalid GPX coordinate"
          name = root.findtext(".//{*}metadata/{*}name", default="")
          assert "SYNTHETIC" in name.upper(), "Demo fixture must be clearly labeled synthetic"
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
