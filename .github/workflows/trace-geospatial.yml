name: TRACE geospatial validation

on:
  push:
    branches: [main]
    paths:
      - "platform-prototype/backend/**"
      - "platform-prototype/frontend/**"
      - ".github/workflows/trace-geospatial.yml"
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r platform-prototype/backend/requirements.txt
      - name: Run backend unit tests
        working-directory: platform-prototype/backend
        run: python -m unittest discover -s tests -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: platform-prototype/frontend
        run: npm install
      - name: Type-check and build frontend
        working-directory: platform-prototype/frontend
        run: npm run build
